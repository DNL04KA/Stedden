# Local development stack. Two backend processes share one image and the `core`
# package but run as independent services — a crash in `api` must never drop a
# live call in `voice_worker`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stedden
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  voice_worker:
    build:
      context: ./backend
    command: uvicorn voice_worker.main:app --host 0.0.0.0 --port 8080
    env_file: ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
